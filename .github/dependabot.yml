version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
    ignore:
      # Laravel 12 and 13 only: another Laravel major is the Flashpi owner's decision, and
      # Testbench's majors follow Laravel's (10 for Laravel 12, 11 for Laravel 13).
      - dependency-name: 'illuminate/*'
        update-types: ['version-update:semver-major']
      - dependency-name: orchestra/testbench
        update-types: ['version-update:semver-major']
